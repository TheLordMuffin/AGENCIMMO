<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="AGENCIMMO — vendez votre bien sans commission d'agence."><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>AGENCIMMO</title>
<meta name="theme-color" content="#0F231B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AGENCIMMO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
/* ============================================================
   AGENCIMMO — l'application.
   Plein écran sur téléphone, encadrée sur grand écran.
   Univers visuel unique et assumé : toutes les couleurs sont
   peintes explicitement, aucune ne dépend du thème de l'hôte.
   ============================================================ */
:root{
  --ink:#08130F;
  --pine-950:#0B1913;
  --pine-900:#0F231B;
  --pine-800:#153125;
  --pine:#0E5C43;
  --brass:#C89A47;
  --brass-bright:#E3B95F;
  --brass-dim:#8E6D31;
  --paper:#EEF2EA;
  --paper-2:#E4EADE;
  --paper-3:#D7E0D0;
  --chalk:#FBFCF9;
  --on-dark:#E9EFE6;
  --on-dark-mute:#9BB0A3;
  --on-light:#0F1F18;
  --on-light-mute:#55685D;
  --rust:#B4523A;
  --line-light:rgba(15,35,27,.13);
  --line-dark:rgba(200,154,71,.20);

  --f-display:"Fraunces","Iowan Old Style",Georgia,serif;
  --f-sans:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--f-sans);
  background:var(--pine-950);
  color:var(--on-light);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
}
img{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px;border-radius:6px}

/* ---------- châssis ---------- */
.shell{min-height:100dvh;display:grid;place-items:center;padding:0}
.app{
  position:relative;
  width:100%;max-width:440px;
  height:100dvh;max-height:940px;
  display:flex;flex-direction:column;
  background:var(--chalk);color:var(--on-light);
  overflow:hidden;isolation:isolate;
}
/* Sur grand écran, l'app est présentée comme un appareil ; sur téléphone
   elle occupe tout, sans cadre ni ombre. */
@media (min-width:521px){
  .shell{padding:24px;background:
    radial-gradient(120% 90% at 70% 0%, rgba(200,154,71,.10), transparent 60%),
    var(--pine-950);}
  .app{border-radius:34px;box-shadow:0 40px 90px -40px rgba(0,0,0,.9),0 0 0 1px rgba(255,255,255,.06)}
}
/* ---------- réinitialisation de la démo ---------- */
.reset{
  margin-top:4px;align-self:flex-start;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;
  color:var(--on-light-mute);text-decoration:underline;
  text-underline-offset:3px;padding:6px 0;
}
.reset:hover{color:var(--rust)}
/* corps scrollable de l'écran */
.views{position:relative;flex:1;overflow:hidden}
.view{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  background:var(--chalk);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .26s ease,transform .32s cubic-bezier(.2,.8,.3,1),visibility .26s;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.view::-webkit-scrollbar{display:none}
.view.on{opacity:1;visibility:visible;transform:none;z-index:2}
.view-pad{padding:0 0 22px}

/* barre de navigation basse */
.tabbar{
  flex:none;display:grid;grid-template-columns:repeat(5,1fr);
  align-items:center;gap:2px;
  padding:9px 8px calc(9px + env(safe-area-inset-bottom,0px));
  background:rgba(251,252,249,.94);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line-light);
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:5px 2px;border-radius:12px;
  font-size:9.5px;font-weight:600;letter-spacing:.02em;
  color:#8C9A92;transition:color .16s;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--pine)}
.tab-fab{position:relative}
.tab-fab .fab{
  width:40px;height:40px;border-radius:14px;margin-top:-6px;
  background:var(--pine);color:var(--chalk);
  display:grid;place-items:center;
  box-shadow:0 8px 18px -7px rgba(14,92,67,.85);
  transition:transform .18s cubic-bezier(.2,.8,.3,1);
}
.tab-fab:hover .fab{transform:translateY(-2px) rotate(90deg)}
.tab-fab .fab svg{width:20px;height:20px;stroke-width:2.1}

/* ---------- en-tête de l'app ---------- */
.app-head{padding:6px 18px 12px;display:flex;flex-direction:column;gap:12px;background:var(--chalk)}
.brandline{display:flex;align-items:center;justify-content:space-between}
.brandmark{display:flex;align-items:center;gap:8px}
.brandmark .key{width:24px;height:24px}
.brandmark b{font-family:var(--f-display);font-size:19px;font-weight:600;letter-spacing:-.02em;font-variation-settings:"SOFT" 30,"WONK" 1}
.icon-btn{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--on-light);transition:background .16s}
.icon-btn:hover{background:var(--paper-2)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dot-badge{position:relative}
.dot-badge::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:99px;background:var(--rust);border:1.5px solid var(--chalk)}

.searchbar{
  display:flex;align-items:center;gap:9px;
  padding:11px 14px;border-radius:14px;
  background:var(--paper-2);color:var(--on-light-mute);
  font-size:13.5px;
}
.searchbar svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;flex:none}
.searchbar input{border:0;background:none;font:inherit;color:var(--on-light);flex:1;min-width:0;outline:none}
.searchbar input::placeholder{color:#8C9A92}

.chips{display:flex;gap:7px;overflow-x:auto;padding:0 18px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line-light);
  font-size:12px;font-weight:600;color:var(--on-light-mute);
  white-space:nowrap;transition:all .16s;
}
.chip:hover{border-color:var(--pine);color:var(--pine)}
.chip.on{background:var(--pine);border-color:var(--pine);color:var(--chalk)}

.sec-label{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:4px 18px 10px;
}
.sec-label b{font-family:var(--f-display);font-size:16px;font-weight:600;font-variation-settings:"SOFT" 20}
.sec-label span{font-family:var(--f-mono);font-size:10.5px;color:var(--on-light-mute);letter-spacing:.04em}

/* ---------- carte annonce ---------- */
.cards{display:flex;flex-direction:column;gap:16px;padding:0 18px}
.card{
  border-radius:18px;overflow:hidden;background:var(--chalk);color:var(--on-light);
  border:1px solid var(--line-light);
  text-align:left;width:100%;display:block;
  transition:transform .2s cubic-bezier(.2,.8,.3,1),box-shadow .2s,border-color .2s;
}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(15,35,27,.5);border-color:rgba(14,92,67,.35)}
.card-media{display:block;position:relative;aspect-ratio:16/11;background:var(--paper-2);overflow:hidden}
.card-media svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.card-tags{display:flex;position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 60px)}
.tag{
  font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:5px 9px;border-radius:7px;
  background:rgba(251,252,249,.93);color:var(--pine);
  backdrop-filter:blur(4px);
}
.tag.mine{background:var(--brass);color:var(--ink)}
.tag.new{background:var(--pine);color:var(--chalk)}
.heart{
  position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:11px;
  display:grid;place-items:center;
  background:rgba(251,252,249,.93);backdrop-filter:blur(4px);
  color:var(--on-light);transition:transform .16s,color .16s;
}
.heart:hover{transform:scale(1.09)}
.heart svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
.heart.on{color:var(--rust)}
.heart.on svg{fill:var(--rust)}
.card-body{display:flex;padding:12px 13px 14px;display:flex;flex-direction:column;gap:7px}
.card-price{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card-price b{font-family:var(--f-mono);font-size:17px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.card-price i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--on-light-mute)}
.card-title{font-size:13.5px;font-weight:600;line-height:1.32;color:var(--on-light)}
.card-meta{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--on-light-mute);flex-wrap:wrap}
.card-meta .sep{width:3px;height:3px;border-radius:99px;background:#B4C0B8}
.saving{
  display:inline-flex;align-items:center;gap:6px;
  font-family:var(--f-mono);font-size:10.5px;font-weight:500;
  color:var(--brass-dim);background:rgba(200,154,71,.13);
  padding:5px 9px;border-radius:7px;align-self:flex-start;
}
.dpe{
  font-family:var(--f-mono);font-size:10px;font-weight:600;
  width:19px;height:19px;border-radius:5px;display:grid;place-items:center;color:var(--chalk);
}

/* ---------- fiche annonce ---------- */
.detail-hero{position:relative;aspect-ratio:16/12;background:var(--paper-2)}
.detail-hero svg{position:absolute;inset:0;width:100%;height:100%}
.detail-back{
  position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:12px;
  display:grid;place-items:center;background:rgba(251,252,249,.94);backdrop-filter:blur(4px);color:var(--on-light);
}
.detail-back svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px}
.dots i{width:5px;height:5px;border-radius:99px;background:rgba(251,252,249,.55)}
.dots i.on{width:16px;background:var(--chalk)}
.detail-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:16px}
.detail-price{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.detail-price b{font-family:var(--f-mono);font-size:26px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.detail-price small{font-family:var(--f-mono);font-size:10.5px;color:var(--on-light-mute);display:block;margin-top:5px}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.spec{
  border:1px solid var(--line-light);border-radius:12px;padding:9px 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;
}
.spec b{font-family:var(--f-mono);font-size:13px;font-weight:600}
.spec span{font-size:9.5px;color:var(--on-light-mute);letter-spacing:.02em}
.prose{font-size:13px;line-height:1.62;color:var(--on-light-mute)}
.seller{
  display:flex;align-items:center;gap:11px;
  border:1px solid var(--line-light);border-radius:16px;padding:12px;
}
.avatar{
  width:42px;height:42px;border-radius:13px;flex:none;display:grid;place-items:center;
  font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--chalk);
}
.seller-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.seller-info b{font-size:13.5px;font-weight:600}
.stars{display:flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:11px;color:var(--on-light-mute)}
.stars svg{width:12px;height:12px;fill:var(--brass);stroke:none}
.badge-verif{
  display:inline-flex;align-items:center;gap:5px;
  font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--pine);background:rgba(14,92,67,.1);padding:4px 8px;border-radius:6px;
}
.badge-verif svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.seller-sub{font-size:11.5px;color:var(--on-light-mute);line-height:1.4}
.trust{border:1px solid var(--line-light);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:11px}
.trust-head{display:flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--pine)}
.trust-head svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--pine);background:rgba(14,92,67,.09);padding:5px 9px;border-radius:7px}
.fact svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.measures{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;border-top:1px solid var(--line-light);padding-top:11px}
.measures span{display:flex;flex-direction:column;gap:2px;font-size:9.5px;color:var(--on-light-mute);line-height:1.3}
.measures b{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--on-light);font-variant-numeric:tabular-nums}
.conform,.histo{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5;color:var(--on-light-mute)}
.conform b{color:var(--on-light)}
.conform.muted{color:#8C9A92}
.conform svg,.histo svg{width:14px;height:14px;flex:none;margin-top:2px;stroke:var(--brass-dim);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.no-rating{font-size:10.5px;line-height:1.5;color:#8C9A92;border-top:1px solid var(--line-light);padding-top:10px}
.review{border-top:1px solid var(--line-light);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.review-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600}
.review p{font-size:12.5px;line-height:1.55;color:var(--on-light-mute)}
/* Barre d'action collante : sans fond opaque, le contenu défile dessous
   et se lit à travers. Les marges négatives compensent le retrait de
   .detail-body pour qu'elle occupe toute la largeur. */
.cta-row{
  display:flex;gap:9px;position:sticky;bottom:0;z-index:5;
  margin:0 -18px -20px;padding:10px 18px 14px;
  background:var(--chalk);
  box-shadow:0 -10px 18px -10px rgba(15,35,27,.18);
}
.btn-app{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:14px;border-radius:14px;font-size:13.5px;font-weight:600;
  transition:transform .16s,background .16s,box-shadow .16s;
}
.btn-app:hover{transform:translateY(-2px)}
.btn-app svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn-primary{background:var(--pine);color:var(--chalk);box-shadow:0 10px 22px -12px rgba(14,92,67,.9)}
.btn-outline{border:1.5px solid var(--line-light);color:var(--on-light);flex:0 0 auto;padding-inline:18px}
.btn-outline:hover{border-color:var(--pine);color:var(--pine)}

/* ---------- dépôt d'annonce ---------- */
.wizard{padding:6px 18px 20px;display:flex;flex-direction:column;gap:16px}
.steps{display:flex;align-items:center;gap:6px}
.step-pip{flex:1;height:3px;border-radius:99px;background:var(--paper-3);overflow:hidden}
.step-pip i{display:block;height:100%;width:0;background:var(--pine);border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.3,1)}
.step-pip.done i,.step-pip.now i{width:100%}
.step-title{display:flex;flex-direction:column;gap:5px}
.step-title span{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--pine)}
.step-title b{font-family:var(--f-display);font-size:21px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.step-title p{font-size:12.5px;color:var(--on-light-mute);line-height:1.5}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--on-light)}
.field input,.field select,.field textarea{
  width:100%;font:inherit;font-size:13.5px;color:var(--on-light);
  padding:11px 13px;border-radius:12px;
  border:1.5px solid var(--line-light);background:var(--chalk);
  outline:none;transition:border-color .16s,box-shadow .16s;
}
.field textarea{resize:none;line-height:1.5;min-height:74px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pine);box-shadow:0 0 0 3px rgba(14,92,67,.12)}
.field input::placeholder,.field textarea::placeholder{color:#9AA79F}
.field .hint{font-size:10.5px;color:var(--on-light-mute)}
.field.err input,.field.err select{border-color:var(--rust)}
.field .err-msg{font-size:10.5px;color:var(--rust);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pickers{display:flex;gap:7px;flex-wrap:wrap}
.pick{
  padding:9px 13px;border-radius:11px;border:1.5px solid var(--line-light);
  font-size:12.5px;font-weight:600;color:var(--on-light-mute);transition:all .16s;
}
.pick:hover{border-color:var(--pine);color:var(--pine)}
.pick.on{background:var(--pine);border-color:var(--pine);color:var(--chalk)}
.stepper{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line-light);border-radius:12px;padding:6px 8px}
.stepper b{font-family:var(--f-mono);font-size:15px;font-weight:600}
.stepper button{width:28px;height:28px;border-radius:9px;background:var(--paper-2);display:grid;place-items:center;font-size:16px;line-height:1;color:var(--pine);font-weight:600;transition:background .16s}
.stepper button:hover{background:var(--paper-3)}
.stepper .lbl{font-size:10px;color:var(--on-light-mute);letter-spacing:.02em;display:block;text-align:center}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photo-slot{
  position:relative;aspect-ratio:1;border-radius:13px;overflow:hidden;
  border:1.5px dashed var(--line-light);background:var(--paper-2);
  display:grid;place-items:center;color:var(--on-light-mute);transition:all .16s;
}
.photo-slot:hover{border-color:var(--pine);color:var(--pine)}
.photo-slot svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.photo-slot.filled{border-style:solid;border-color:transparent;background:var(--paper-3)}
.photo-slot.filled img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo-slot .illus-wrap{position:absolute;inset:0;display:block}
.photo-slot .illus-wrap svg{width:100%;height:100%;display:block}
.photo-slot .rm{
  position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:7px;z-index:2;
  background:rgba(11,25,19,.72);color:var(--chalk);display:grid;place-items:center;font-size:12px;line-height:1;
}
.photo-slot .cover-tag{
  position:absolute;bottom:4px;left:4px;z-index:2;
  font-family:var(--f-mono);font-size:8px;font-weight:600;letter-spacing:.06em;
  background:var(--brass);color:var(--ink);padding:3px 6px;border-radius:5px;
}
.estim{
  border-radius:16px;padding:14px;
  background:linear-gradient(150deg,rgba(14,92,67,.09),rgba(200,154,71,.11));
  border:1px solid rgba(14,92,67,.18);
  display:flex;flex-direction:column;gap:9px;
}

/* toast dans l'app */
.toast{
  position:absolute;left:14px;right:14px;bottom:14px;z-index:20;

  pointer-events:none; /* ne doit jamais bloquer une carte pendant ses 2,6 s */
}
/* Masqué par opacité et visibilité, jamais par un simple décalage : selon
   la hauteur à laquelle il flotte, un translate ne le sort pas de l'écran. */
.toast.on{opacity:1;visibility:visible;transform:none}
.toast svg{width:17px;height:17px;stroke:var(--brass);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}

<script>
"use strict";
/* ============================================================
   1. ILLUSTRATIONS — façades dessinées en SVG.
   Aucune image externe : chaque bien a son élévation, dans une
   palette cohérente avec l'identité (pin, laiton, craie).
   ============================================================ */
let uid = 0;
const P = {
  skyA:["#DEE7DD","#E6E3D6","#DCE4E4","#EAE3D4"],
  skyB:["#F4F1E7","#F6F0E2","#F1F2EC","#F7F1E4"],
  wall:["#EDE6D8","#E3D9C7","#F1ECE3","#DED3C0","#E8DFCE"],
  roof:["#8C5E46","#6E4A3A","#3E4B45","#7A5340","#4A4740"],
  glass:"#16352A", lit:"#E3B95F", sill:"#CFC4B0",
  tree:"#2C5A45", tree2:"#3C7057", trunk:"#6B5237",
  ground:"#DCE3D5", ground2:"#CBD5C4"
};
const pick = (arr,s)=>arr[Math.abs(s)%arr.length];

function shell(inner,id,sA,sB){
  return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration du bien">
  <defs>
    <linearGradient id="sky${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${sA}"/><stop offset="1" stop-color="${sB}"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky${id})"/>
  ${inner}</svg>`;
}
function tree(x,y,s,c){
  return `<g transform="translate(${x} ${y}) scale(${s})">
    <rect x="-3" y="-26" width="6" height="30" rx="2" fill="${P.trunk}"/>
    <circle cx="0" cy="-40" r="24" fill="${c}"/>
    <circle cx="-15" cy="-28" r="16" fill="${c}" opacity=".85"/>
    <circle cx="15" cy="-30" r="14" fill="${c}" opacity=".9"/></g>`;
}
function win(x,y,w,h,lit,shutters){
  let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" fill="${lit?P.lit:P.glass}"/>
  <path d="M${x+w/2} ${y}V${y+h}M${x} ${y+h/2}H${x+w}" stroke="${lit?"#B98B34":"#0B1913"}" stroke-width="1.4" opacity=".55"/>
  <rect x="${x-2}" y="${y+h}" width="${w+4}" height="3" fill="${P.sill}"/>`;
  if(shutters) s += `<rect x="${x-7}" y="${y}" width="6" height="${h}" rx="1" fill="${P.tree}" opacity=".82"/>
  <rect x="${x+w+1}" y="${y}" width="6" height="${h}" rx="1" fill="${P.tree}" opacity=".82"/>`;
  return s;
}

const KINDS = {
  village(id,s){
    const w=pick(P.wall,s), r=pick(P.roof,s+1);
    return `<rect y="215" width="400" height="85" fill="${P.ground}"/>
    ${tree(52,232,1.15,P.tree)}
    <rect x="104" y="112" width="200" height="108" fill="${w}"/>
    <path d="M92 116 204 44l112 72z" fill="${r}"/>
    <rect x="92" y="112" width="224" height="8" fill="${r}" opacity=".8"/>
    <rect x="252" y="52" width="17" height="34" fill="${r}"/>
    ${win(134,134,30,36,false,true)}${win(244,134,30,36,true,true)}
    <rect x="186" y="158" width="36" height="62" rx="2" fill="${P.tree}"/>
    <circle cx="214" cy="190" r="2.4" fill="${P.lit}"/>
    <rect x="180" y="216" width="48" height="5" fill="${P.ground2}"/>
    ${tree(348,236,.95,P.tree2)}
    <path d="M0 258h400" stroke="${P.ground2}" stroke-width="10" opacity=".7"/>`;
  },
  haussmann(id,s){
    const w=pick(P.wall,s+2);
    let rows="";
    for(let r=0;r<3;r++) for(let c=0;c<4;c++){
      const x=68+c*72, y=76+r*66, lit=(r*4+c+s)%5===0;
      rows += win(x,y,34,44,lit,false);
      rows += `<rect x="${x-8}" y="${y+44}" width="50" height="4" fill="${P.sill}"/>
      <g stroke="${P.roof[2]}" stroke-width="1.6" opacity=".65">
        ${[0,1,2,3,4,5,6].map(i=>`<path d="M${x-6+i*8} ${y+34}v14"/>`).join("")}
        <path d="M${x-7} ${y+34}h48"/></g>`;
    }
    return `<rect y="272" width="400" height="28" fill="${P.ground}"/>
    <rect x="46" y="52" width="308" height="222" fill="${w}"/>
    <rect x="38" y="44" width="324" height="14" rx="2" fill="${P.sill}"/>
    <path d="M38 44 60 18h280l22 26z" fill="${pick(P.roof,s+4)}"/>
    ${rows}
    <rect x="176" y="212" width="48" height="62" rx="3" fill="${P.tree}"/>
    <rect x="182" y="218" width="36" height="26" rx="2" fill="${P.glass}"/>
    <circle cx="212" cy="252" r="2.6" fill="${P.lit}"/>
    ${tree(28,278,.8,P.tree2)}${tree(378,280,.75,P.tree)}`;
  },
  loft(id,s){
    const w="#C9B7A4";
    let g="";
    for(let c=0;c<3;c++){
      const x=88+c*98;
      g += `<rect x="${x}" y="112" width="72" height="86" fill="${(c+s)%3===0?P.lit:P.glass}" opacity="${(c+s)%3===0?.92:1}"/>`;
      g += `<g stroke="${w}" stroke-width="3">${[1,2].map(i=>`<path d="M${x+i*24} 112v86"/>`).join("")}<path d="M${x} 141h72M${x} 170h72"/></g>`;
    }
    return `<rect y="198" width="400" height="102" fill="${P.ground}"/>
    <rect x="64" y="96" width="292" height="104" fill="${w}"/>
    <path d="M64 96l38-42 38 42M140 96l38-42 38 42M216 96l38-42 38 42M292 96l38-42 26 30v12z" fill="${pick(P.roof,s+2)}"/>
    ${g}
    <rect x="64" y="196" width="292" height="6" fill="${P.roof[4]}" opacity=".5"/>
    ${tree(32,224,1,P.tree)}
    <path d="M0 246h400" stroke="${P.ground2}" stroke-width="12" opacity=".65"/>`;
  },
  villa(id,s){
    return `<rect y="196" width="400" height="104" fill="${P.ground}"/>
    <rect x="70" y="104" width="240" height="94" fill="${pick(P.wall,s)}"/>
    <rect x="58" y="94" width="264" height="12" rx="2" fill="#F4F1E9"/>
    <rect x="96" y="122" width="118" height="76" fill="${P.glass}"/>
    <path d="M155 122v76" stroke="#F4F1E9" stroke-width="3"/>
    ${win(240,126,42,40,true,false)}
    <rect x="70" y="196" width="240" height="5" fill="${P.ground2}"/>
    <rect x="106" y="228" width="196" height="46" rx="23" fill="#8FB9C4"/>
    <rect x="118" y="238" width="172" height="26" rx="13" fill="#A6CCD4" opacity=".8"/>
    ${tree(48,214,1.05,P.tree2)}${tree(352,218,.9,P.tree)}
    <rect x="322" y="150" width="7" height="52" rx="3" fill="${P.trunk}"/>
    <path d="M325 152c-16-10-26-4-30 6 12-6 20-4 26 2zM326 152c16-10 26-4 30 6-12-6-20-4-26 2z" fill="${P.tree2}"/>`;
  },
  ferme(id,s){
    const w=pick(P.wall,s+3), r=pick(P.roof,s);
    return `<rect y="206" width="400" height="94" fill="${P.ground}"/>
    <rect x="52" y="140" width="296" height="68" fill="${w}"/>
    <path d="M40 144 200 82l160 62z" fill="${r}"/>
    ${win(84,156,26,30,false,true)}${win(150,156,26,30,true,true)}${win(276,156,26,30,false,true)}
    <path d="M198 208v-46a20 20 0 0 1 40 0v46z" fill="${P.tree}"/>
    <rect x="84" y="98" width="14" height="30" fill="${r}"/>
    ${tree(28,226,1.2,P.tree2)}${tree(370,232,1,P.tree)}
    <g stroke="${P.ground2}" stroke-width="7" opacity=".7"><path d="M0 234h400M0 258h400M0 282h400"/></g>`;
  },
  appart(id,s){
    let b="";
    for(let r=0;r<4;r++) for(let c=0;c<3;c++){
      const x=104+c*68, y=64+r*50, lit=(r+c+s)%4===0;
      b += `<rect x="${x}" y="${y}" width="46" height="30" fill="${lit?P.lit:P.glass}"/>
      <rect x="${x-6}" y="${y+30}" width="58" height="9" rx="2" fill="#F1EDE4"/>
      <rect x="${x-6}" y="${y+30}" width="58" height="9" rx="2" fill="none" stroke="${P.sill}"/>`;
      if((r+c)%3===0) b += `<circle cx="${x+40}" cy="${y+27}" r="6" fill="${P.tree2}"/>`;
    }
    return `<rect y="270" width="400" height="30" fill="${P.ground}"/>
    <rect x="88" y="46" width="226" height="226" fill="${pick(P.wall,s+1)}"/>
    <rect x="80" y="38" width="242" height="12" rx="2" fill="#F4F1E9"/>
    ${b}
    <rect x="176" y="222" width="52" height="50" rx="3" fill="${P.glass}"/>
    ${tree(46,282,.9,P.tree)}${tree(360,284,.85,P.tree2)}`;
  }
};
const KIND_KEYS = Object.keys(KINDS);
function illus(kind,seed){
  const id = ++uid;
  const k = KINDS[kind] ? kind : KIND_KEYS[Math.abs(seed)%KIND_KEYS.length];
  const s = Math.abs(seed|0);
  return shell(KINDS[k](id,s), id, pick(P.skyA,s), pick(P.skyB,s+1));
}

const STORE = "agencimmo.demo.v1";
const state = {
  tab:"feed", current:null, filter:"tous",
  favs:new Set(), mine:[], step:0, chatOpen:null, myThread:null,
  draft:blankDraft()
};
function blankDraft(){
  return {kind:"village",titre:"",ville:"",quartier:"",prix:"",m2:"",pieces:3,ch:2,dpe:"C",desc:"",photos:[]};
}
function load(){
  try{
    const raw = localStorage.getItem(STORE);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(Array.isArray(d.mine)) state.mine = d.mine;
    if(Array.isArray(d.favs)) state.favs = new Set(d.favs);
  }catch(e){/* stockage indisponible : la démo tourne sans mémoire */}
}
function save(){
  try{
    localStorage.setItem(STORE, JSON.stringify({mine:state.mine, favs:[...state.favs]}));
  }catch(e){/* quota ou navigation privée : on ignore */}
}
const listings = ()=>[...state.mine, ...SEED];

/* ---------- formatage ---------- */
const eur = n=>new Intl.NumberFormat("fr-FR",{maximumFractionDigits:0}).format(Math.round(n))+"\u00a0€";
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eco = prix=>Math.max(0, Math.round(prix*0.045 - 990));
function initiales(nom){
  return nom.trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase()||"?";
}
function teinte(seed){
  const tons=["#0E5C43","#B8873B","#3E6B57","#8E6D31","#245C4C"];
  return tons[Math.abs(hash(seed))%tons.length];
}
function hash(s){let h=0;for(let i=0;i<String(s).length;i++)h=(h*31+String(s).charCodeAt(i))|0;return h}
function media(l){
  const p = l.photos && l.photos[0];
  if(!p) return illus(l.kind, hash(l.id));
  return p.startsWith("data:") ? `<img src="${p}" alt="Photo du bien">` : p;
}

/* ---------- estimation automatique ---------- */
const DPE_K  = {A:1.07,B:1.05,C:1.02,D:1,E:.95,F:.90,G:.85};
const KIND_K = {villa:1.12,loft:1.06,haussmann:1.04,appart:1.02,village:1,ferme:.92};
function estimate(d){
  const m2 = parseFloat(String(d.m2).replace(",","."));
  if(!m2 || m2 <= 0) return null;
  const base = PRIX_M2[(d.ville||"").trim().toLowerCase()] || 2800;
  let k = (DPE_K[d.dpe]||1) * (KIND_K[d.kind]||1);
  k *= m2 > 150 ? 0.93 : m2 < 45 ? 1.08 : 1;
  const mid = base * m2 * k;
  return {mid, low: mid*0.93, high: mid*1.07, m2:Math.round(base*k), connue:!!PRIX_M2[(d.ville||"").trim().toLowerCase()]};
}
function estimHTML(){
  const e = estimate(state.draft);
  if(!e) return `<div class="estim"><div class="estim-top">${svg(I.spark)}Estimation automatique</div>
    <p style="font-size:12.5px;color:var(--on-light-mute);line-height:1.5">Renseignez la ville et la surface à l'étape précédente pour obtenir une fourchette de prix.</p></div>`;
  const p = parseFloat(String(state.draft.prix).replace(/[^\d.]/g,""));
  const lo = e.low*0.85, hi = e.high*1.15;
  const pos = p ? Math.max(0,Math.min(100,(p-lo)/(hi-lo)*100)) : null;
  let verdict = "";
  if(p){
    if(p < e.low) verdict = `<span style="color:var(--pine);font-weight:600">Sous le marché — vous devriez vendre vite.</span>`;
    else if(p > e.high) verdict = `<span style="color:var(--rust);font-weight:600">Au-dessus du marché — attendez-vous à peu de visites.</span>`;
    else verdict = `<span style="color:var(--pine);font-weight:600">Dans la fourchette du secteur.</span>`;
  }
  return `<div class="estim">
    <div class="estim-top">${svg(I.spark)}Estimation automatique</div>
    <b>${eur(e.mid)}</b>
    <div class="range">Fourchette : ${eur(e.low)} — ${eur(e.high)} · base ${e.m2.toLocaleString("fr-FR")} €/m²</div>
    <div class="gauge"><i style="left:${((e.low-lo)/(hi-lo))*100}%;width:${((e.high-e.low)/(hi-lo))*100}%"></i></div>
    <div class="range" style="line-height:1.5">${p?verdict:"Saisissez votre prix pour vous situer."}
    ${e.connue?"":"<br>Ville hors référentiel : base nationale appliquée."}</div>
  </div>`;
}

const VIEWS = {feed:viewFeed, favs:viewFavs, publish:viewPublish, chat:viewChat, profile:viewProfile, detail:viewDetail};

function render(){
  const node = document.createElement("div");
  node.className = "view";
  node.innerHTML = (VIEWS[state.tab] || viewFeed)();
  views.replaceChildren(node);
  requestAnimationFrame(()=>node.classList.add("on"));

}
function go(tab){
  if(tab === "publish" && state.step === 3){ state.step = 0; state.draft = blankDraft(); }
  if(tab !== "chat") state.chatOpen = null;
  state.tab = tab;
  render();
}
function openDetail(id){ state.current = id; state.tab = "detail"; render(); }

let toastT;
function toast(msg){
  const el = document.getElementById("toast");
  document.getElementById("toastMsg").textContent = msg;
  el.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(()=>el.classList.remove("on"), 2600);
}

views.addEventListener("click", ev=>{
  const t = ev.target;
  const q = s=>t.closest(s);

  const fav = q("[data-fav]");
  if(fav){
    ev.preventDefault(); ev.stopPropagation();
    const id = fav.dataset.fav;
    state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
    save();
    fav.classList.toggle("on", state.favs.has(id));
    toast(state.favs.has(id) ? "Ajouté à vos favoris" : "Retiré des favoris");
    return;
  }
  const open = q("[data-open]");      if(open){ openDetail(open.dataset.open); return; }
  const gt   = q("[data-goto-tab]");  if(gt){ go(gt.dataset.gotoTab); return; }
  const back = q("[data-back]");      if(back){ go("feed"); return; }
  const fil  = q("[data-filter]");    if(fil){ state.filter = fil.dataset.filter; render(); return; }
  const th   = q("[data-thread]");    if(th){ state.chatOpen = th.dataset.thread; state.tab="chat"; render(); return; }
  if(q("[data-chatback]")){ state.chatOpen = null; render(); return; }
  const msg  = q("[data-msg]");       if(msg){ state.tab="chat"; state.chatOpen = allThreads()[0].id; render(); return; }
  if(q("[data-visite]")){ toast("Demande de visite envoyée"); return; }
  if(q("[data-send]")){
    const inp = document.getElementById("chatIn");
    if(inp && inp.value.trim()){ pushMessage(inp.value.trim()); } 
    return;
  }

  /* --- dépôt d'annonce --- */
  const kind = q("[data-kind]");
  if(kind){ state.draft.kind = kind.dataset.kind; render(); return; }
  const inc = q("[data-inc]");
  if(inc){
    const k = inc.dataset.inc;
    state.draft[k] = Math.max(1, Math.min(20, state.draft[k] + Number(inc.dataset.by)));
    render(); return;
  }
  if(q("[data-addphoto]")){ const f = document.getElementById("fileIn"); if(f) f.click(); return; }
  const rm = q("[data-rmphoto]");
  if(rm){ state.draft.photos.splice(Number(rm.dataset.rmphoto),1); render(); return; }
  if(q("[data-genphoto]")){
    if(state.draft.photos.length >= 6){ toast("Six photos, c'est déjà bien"); return; }
    state.draft.photos.push(illus(state.draft.kind, Date.now() + state.draft.photos.length));
    render(); return;
  }
  const wiz = q("[data-wiz]");
  if(wiz){ wiz.dataset.wiz === "prev" ? prevStep() : nextStep(); return; }
});

/* filtrage en place : re-rendre ferait perdre le focus du champ */
function filterCards(q){
  const needle = q.trim().toLowerCase();
  const list = views.querySelector(".cards");
  if(!list) return;
  let n = 0;
  list.querySelectorAll(".card").forEach(c=>{
    const hit = !needle || c.textContent.toLowerCase().includes(needle);
    c.hidden = !hit;
    if(hit) n++;
  });
  const label = views.querySelector(".sec-label b");
  if(label) label.textContent = `${n} bien${n>1?"s":""} ${needle?"trouvé"+(n>1?"s":""):"près de vous"}`;
}

/* ---------- photos : lecture et réduction ---------- */
views.addEventListener("change", ev=>{
  if(ev.target.id !== "fileIn") return;
  const files = [...ev.target.files].slice(0, 6 - state.draft.photos.length);
  if(!files.length) return;
  let pending = files.length;
  files.forEach(file=>{
    shrink(file, url=>{
      if(url) state.draft.photos.push(url);
      if(--pending === 0) render();
    });
  });
});
function shrink(file, done){
  if(!file.type.startsWith("image/")){ done(null); return; }
  const reader = new FileReader();
  reader.onerror = ()=>done(null);
  reader.onload = () => {
    const img = new Image();
    img.onerror = ()=>done(null);
    img.onload = ()=>{
      const max = 760;
      const r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * r);
      c.height = Math.round(img.height * r);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      try{ done(c.toDataURL("image/jpeg", 0.72)); }catch(e){ done(null); }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- assistant : navigation et validation ---------- */
function prevStep(){ state.step = Math.max(0, state.step - 1); render(); }
function nextStep(){
  if(state.step === 1){
    const d = state.draft;
    const bad = [];
    if(!d.titre.trim()) bad.push("titre");
    if(!d.ville.trim()) bad.push("ville");
    if(!(parseFloat(String(d.m2).replace(",",".")) > 0)) bad.push("m2");
    if(bad.length){
      bad.forEach(k=>document.querySelector(`[data-f="${k}"]`)?.closest(".field")?.classList.add("err"));
      document.querySelector(`[data-f="${bad[0]}"]`)?.focus();
      toast("Titre, ville et surface sont nécessaires");
      return;
    }
  }
  if(state.step === 2){ publish(); return; }
  state.step++;
  render();
}
function publish(){
  const d = state.draft;
  const prix = parseFloat(String(d.prix).replace(/[^\d.]/g,""));
  if(!(prix > 0)){
    document.querySelector('[data-f="prix"]')?.closest(".field")?.classList.add("err");
    document.querySelector('[data-f="prix"]')?.focus();
    toast("Indiquez un prix de vente");
    return;
  }
  const m2 = parseFloat(String(d.m2).replace(",","."));
  state.mine.unshift({
    id:"m"+Date.now(), mine:true, neuf:true, kind:d.kind,
    titre:d.titre.trim(), ville:d.ville.trim(), quartier:d.quartier.trim(),
    prix, m2:Math.round(m2), pieces:d.pieces, ch:d.ch, dpe:d.dpe,
    desc:d.desc.trim() || "Le propriétaire n'a pas encore rédigé de description. Contactez-le directement, il répond vite.",
    photos:d.photos.slice(),
    vendeur:{nom:"Romain B.",delai:"~1 h",depuis:"aujourd'hui"},
    verif:["identite","propriete"],
    repond:"—", honorees:"0 / 0", conforme:null,
    histo:"Mise en ligne aujourd'hui, prix d'origine.",
    vues:0, favs:0, visites:0
  });
  save();
  state.step = 3;
  render();
  toast("Annonce publiée — et elle est dans le fil");
}
function pushMessage(text){
  const t = allThreads().find(x=>x.id===state.chatOpen);
  if(!t) return;
  t.msgs.push({q:"me", t:text, h:"maintenant"});
  t.apercu = text; t.unread = false;
  render();
  const body = document.getElementById("chatBody");
  if(body) body.scrollTop = body.scrollHeight;
}

  state.draft = blankDraft(); state.step = 0; state.filter = "tous";
  state.current = null; state.chatOpen = null;
  THREADS.forEach(t=>{ t.msgs = t.msgs.filter(m=>m.h !== "maintenant"); });
  go("feed");
  toast("Démo remise à zéro");
});

}
