<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizator</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#fafaf8; color:#181816;
    font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;
    padding:24px 20px 80px;
  }
  .wrap{max-width:600px; margin:0 auto;}

  .line{
    display:flex; align-items:baseline; gap:10px;
    font-size:21px; line-height:1.35; padding:15px 2px;
    border-bottom:2px solid #c9c6bd;
    cursor:pointer; white-space:pre-wrap; word-break:break-word;
    touch-action:none; user-select:none;
  }
  .line.blocked{ border-bottom:2px solid #b3423a; }
  .line-text{ flex:1; min-width:0; }
  .line-assignee{ flex:none; font-size:14px; color:#2f5d50; }
  .line-date{ flex:none; font-size:14px; color:#83807a; }
  .line-date.retard{ color:#b3423a; font-weight:700; }
  .line-sub{ flex:none; font-size:13px; color:#83807a; }

  .panel{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:10px 2px 14px; border-bottom:1px solid #e2e0da; font-size:14px; color:#83807a;
  }
  .panel input[type=text]{
    font:inherit; font-size:15px; border:none; border-bottom:1px solid #c9c6bd;
    background:transparent; color:#181816; outline:none; min-width:140px;
  }
  .panel input[type=date]{
    font:inherit; font-size:14px; border:none; border-bottom:1px solid #c9c6bd;
    background:transparent; color:#181816; outline:none;
  }
  .panel .toggle, .panel .chip, .panel .link{ cursor:pointer; user-select:none; }
  .panel .toggle.on{ color:#b3423a; font-weight:700; text-decoration:underline; }
  .panel .chip{ color:#2f5d50; }
  .panel .chip:hover{ text-decoration:underline; }
  .panel .sep{ color:#c9c6bd; }

  .bottom-bar{ display:flex; justify-content:center; align-items:center; gap:28px; padding:22px 0; }
  .icon-btn{ font-size:22px; color:#c9c6bd; cursor:pointer; user-select:none; }
  .icon-btn:hover{ color:#83807a; }

  .back{ font-size:14px; color:#83807a; cursor:pointer; user-select:none; margin-bottom:14px; display:inline-block; }
  .back:hover{ color:#181816; text-decoration:underline; }

  .hint{ font-size:13px; color:#c9c6bd; padding:15px 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div id="top"></div>
  <div id="list"></div>
  <div class="bottom-bar" id="bottom-bar"></div>
</div>

<script>
(function(){
  "use strict";
  var TKEY = "organizator:v4";
  var CKEY = "organizator:contacts";
  var tasks = loadTasks();
  var contacts = loadContacts();
  var view = "tasks";           // "tasks" ou "settings"
  var openId = null;            // id de tâche avec un panneau ouvert
  var openType = null;          // "menu" (nom/bloqué/deadline) ou "assign" (déléguer)
  var contactOpenId = null;     // id de contact en cours d'édition/ajout

  function loadTasks(){
    try{
      var raw = localStorage.getItem(TKEY);
      if(raw) return JSON.parse(raw);
      var old = localStorage.getItem("organizator:v3");
      if(old){
        var parsed = JSON.parse(old);
        return parsed.map(function(t){
          return { id: t.id || uid(), text: t.text || "", blocked: !!t.blocked, deadline: t.deadline || "", assignee: "" };
        });
      }
    }catch(e){}
    return [];
  }
  function loadContacts(){
    try{ var raw = localStorage.getItem(CKEY); return raw ? JSON.parse(raw) : []; }
    catch(e){ return []; }
  }
  function saveTasks(){ try{ localStorage.setItem(TKEY, JSON.stringify(tasks)); }catch(e){} }
  function saveContacts(){ try{ localStorage.setItem(CKEY, JSON.stringify(contacts)); }catch(e){} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function daysBetween(dateStr){
    var today = new Date(todayStr() + "T00:00:00");
    var d = new Date(dateStr + "T00:00:00");
    return Math.round((d - today) / 86400000);
  }
  function fmtDate(dateStr){
    var p = dateStr.split("-");
    return p[2] + "/" + p[1];
  }

  function render(){
    if(view === "settings") renderSettingsView();
    else renderTasksView();
  }

  // ---------- vue tâches ----------

  function renderTasksView(){
    document.getElementById("top").innerHTML = "";
    var listEl = document.getElementById("list");
    listEl.innerHTML = "";
    tasks.forEach(function(t){
      listEl.appendChild(renderLine(t));
      if(openId === t.id && openType === "menu") listEl.appendChild(renderMenu(t));
      if(openId === t.id && openType === "assign") listEl.appendChild(renderAssign(t));
    });

    var bar = document.getElementById("bottom-bar");
    bar.innerHTML = "";
    var add = document.createElement("span");
    add.className = "icon-btn"; add.id = "btn-add"; add.textContent = "+";
    add.addEventListener("click", addTask);
    bar.appendChild(add);
    var settings = document.createElement("span");
    settings.className = "icon-btn"; settings.textContent = "⚙";
    settings.title = "réglages";
    settings.addEventListener("click", function(){ view = "settings"; render(); });
    bar.appendChild(settings);
  }

  function addTask(){
    // une tâche vide ne doit jamais s'accumuler si on clique plusieurs fois
    tasks = tasks.filter(function(x){ return x.text.trim() !== ""; });
    var t = { id: uid(), text: "", blocked:false, deadline:"", assignee:"" };
    tasks.push(t);
    openId = t.id; openType = "menu";
    saveTasks();
    render();
  }

  function renderLine(t){
    var row = document.createElement("div");
    row.className = "line" + (t.blocked ? " blocked" : "");
    row.dataset.id = t.id;

    var text = document.createElement("span");
    text.className = "line-text";
    text.textContent = t.text;
    row.appendChild(text);

    if(t.assignee){
      var a = document.createElement("span");
      a.className = "line-assignee";
      a.textContent = "→ " + t.assignee;
      row.appendChild(a);
    }

    if(t.deadline){
      var d = document.createElement("span");
      d.className = "line-date" + (daysBetween(t.deadline) < 0 ? " retard" : "");
      d.textContent = fmtDate(t.deadline);
      row.appendChild(d);
    }

    attachGestures(row, t);
    return row;
  }

  function renderMenu(t){
    var panel = document.createElement("div");
    panel.className = "panel";

    var nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = t.text;
    function commitName(){
      var v = nameInput.value.trim();
      if(!v){
        tasks = tasks.filter(function(x){ return x.id !== t.id; });
        openId = null;
        saveTasks(); render();
        return;
      }
      if(v === t.text) return; // rien n'a changé : pas de re-rendu, ça casserait un clic en cours sur un autre contrôle du panneau
      t.text = v;
      saveTasks(); render();
    }
    nameInput.addEventListener("keydown", function(e){
      if(e.key === "Enter") commitName();
    });
    nameInput.addEventListener("blur", commitName);
    panel.appendChild(nameInput);

    var toggle = document.createElement("span");
    toggle.className = "toggle" + (t.blocked ? " on" : "");
    toggle.textContent = "bloqué";
    toggle.addEventListener("click", function(){ t.blocked = !t.blocked; saveTasks(); render(); });
    panel.appendChild(toggle);

    var dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.value = t.deadline || "";
    dateInput.addEventListener("change", function(e){ t.deadline = e.target.value; saveTasks(); render(); });
    panel.appendChild(dateInput);

    return panel;
  }

  function renderAssign(t){
    var panel = document.createElement("div");
    panel.className = "panel";

    if(contacts.length){
      contacts.forEach(function(c, i){
        if(i > 0){
          var sep = document.createElement("span");
          sep.className = "sep"; sep.textContent = "·";
          panel.appendChild(sep);
        }
        var chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = c.name;
        chip.addEventListener("click", function(){
          t.assignee = c.name;
          openId = null;
          saveTasks(); render();
        });
        panel.appendChild(chip);
      });
    }

    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "ou un autre nom…";
    input.value = t.assignee || "";
    function commit(){
      t.assignee = input.value.trim();
      openId = null;
      saveTasks(); render();
    }
    input.addEventListener("keydown", function(e){ if(e.key === "Enter") commit(); });
    input.addEventListener("blur", commit);
    panel.appendChild(input);

    return panel;
  }

  function attachGestures(el, t){
    var startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, moved = false, dir = null;
    var H_THRESHOLD = 70, LOCK = 8;

    el.addEventListener("pointerdown", function(e){
      startX = e.clientX; startY = e.clientY; dx = 0; dy = 0;
      dragging = true; moved = false; dir = null;
      el.setPointerCapture(e.pointerId);
      el.style.transition = "none";
    });
    el.addEventListener("pointermove", function(e){
      if(!dragging) return;
      dx = e.clientX - startX; dy = e.clientY - startY;
      if(!dir && (Math.abs(dx) > LOCK || Math.abs(dy) > LOCK)){
        dir = Math.abs(dy) > Math.abs(dx) ? "v" : "h";
        moved = true;
        if(dir === "v"){ el.style.zIndex = "5"; el.style.boxShadow = "0 4px 10px rgba(0,0,0,.15)"; el.style.background = "#fafaf8"; }
      }
      if(dir === "h") el.style.transform = "translateX(" + dx + "px)";
      else if(dir === "v") el.style.transform = "translateY(" + dy + "px)";
    });
    function end(e){
      if(!dragging) return;
      dragging = false;
      el.style.transition = "transform .15s ease";
      el.style.transform = "";
      el.style.zIndex = ""; el.style.boxShadow = ""; el.style.background = "";

      if(!moved){
        openId = t.id; openType = "menu";
        render();
        return;
      }
      if(dir === "h" && Math.abs(dx) >= H_THRESHOLD){
        openId = t.id; openType = "assign";
        render();
      } else if(dir === "v"){
        reorder(t, e.clientY);
      }
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }

  function reorder(t, clientY){
    var rows = Array.prototype.slice.call(document.querySelectorAll(".line"));
    var newIndex = 0;
    rows.forEach(function(r){
      if(r.dataset.id === t.id) return;
      var rect = r.getBoundingClientRect();
      var mid = rect.top + rect.height / 2;
      if(clientY > mid) newIndex++;
    });
    var fromIndex = tasks.findIndex(function(x){ return x.id === t.id; });
    if(fromIndex === -1) return;
    tasks.splice(fromIndex, 1);
    tasks.splice(newIndex, 0, t);
    saveTasks();
    render();
  }

  // ---------- vue réglages (contacts) ----------

  function renderSettingsView(){
    var top = document.getElementById("top");
    top.innerHTML = "";
    var back = document.createElement("span");
    back.className = "back";
    back.textContent = "← retour";
    back.addEventListener("click", function(){ view = "tasks"; render(); });
    top.appendChild(back);

    var listEl = document.getElementById("list");
    listEl.innerHTML = "";
    if(!contacts.length && contactOpenId === null){
      var hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "aucun contact — ajoute-en un pour créer des raccourcis d'assignation.";
      listEl.appendChild(hint);
    }
    contacts.forEach(function(c){
      listEl.appendChild(renderContactLine(c));
      if(contactOpenId === c.id) listEl.appendChild(renderContactForm(c));
    });
    if(contactOpenId && !contacts.some(function(c){ return c.id === contactOpenId; })){
      // contact en cours de création (pas encore dans la liste)
      var draft = { id: contactOpenId, name:"", email:"", phone:"" };
      listEl.appendChild(renderContactForm(draft, true));
    }

    var bar = document.getElementById("bottom-bar");
    bar.innerHTML = "";
    var add = document.createElement("span");
    add.className = "icon-btn"; add.textContent = "+";
    add.addEventListener("click", addContact);
    bar.appendChild(add);
  }

  function addContact(){
    contacts = contacts.filter(function(c){ return c.name.trim() !== ""; });
    saveContacts();
    contactOpenId = uid();
    render();
  }

  function renderContactLine(c){
    var row = document.createElement("div");
    row.className = "line";
    row.style.cursor = "pointer";

    var text = document.createElement("span");
    text.className = "line-text";
    text.textContent = c.name;
    row.appendChild(text);

    if(c.email || c.phone){
      var sub = document.createElement("span");
      sub.className = "line-sub";
      sub.textContent = [c.email, c.phone].filter(Boolean).join(" · ");
      row.appendChild(sub);
    }

    row.addEventListener("click", function(){
      contactOpenId = contactOpenId === c.id ? null : c.id;
      render();
    });
    return row;
  }

  function renderContactForm(c, isNew){
    var panel = document.createElement("div");
    panel.className = "panel";

    var nameInput = document.createElement("input");
    nameInput.type = "text"; nameInput.placeholder = "nom";
    nameInput.value = c.name;

    var emailInput = document.createElement("input");
    emailInput.type = "text"; emailInput.placeholder = "email (facultatif)";
    emailInput.value = c.email || "";

    var phoneInput = document.createElement("input");
    phoneInput.type = "text"; phoneInput.placeholder = "téléphone (facultatif)";
    phoneInput.value = c.phone || "";

    function commit(){
      var name = nameInput.value.trim();
      var email = emailInput.value.trim();
      var phone = phoneInput.value.trim();
      if(!name){
        contacts = contacts.filter(function(x){ return x.id !== c.id; });
        contactOpenId = null;
        saveContacts(); render();
        return;
      }
      var existing = contacts.find(function(x){ return x.id === c.id; });
      if(existing){
        if(existing.name === name && existing.email === email && existing.phone === phone) return;
        existing.name = name; existing.email = email; existing.phone = phone;
      } else {
        contacts.push({ id: c.id, name: name, email: email, phone: phone });
      }
      saveContacts(); render();
    }
    [nameInput, emailInput, phoneInput].forEach(function(inp){
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter") commit(); });
    });
    // ne valider que quand le focus quitte le panneau entier (pas en passant d'un champ à l'autre)
    panel.addEventListener("focusout", function(e){
      if(panel.contains(e.relatedTarget)) return;
      commit();
    });

    panel.appendChild(nameInput);
    panel.appendChild(emailInput);
    panel.appendChild(phoneInput);

    if(!isNew){
      var del = document.createElement("span");
      del.className = "link"; del.textContent = "supprimer";
      del.addEventListener("click", function(){
        contacts = contacts.filter(function(x){ return x.id !== c.id; });
        contactOpenId = null;
        saveContacts(); render();
      });
      panel.appendChild(del);
    }

    setTimeout(function(){ nameInput.focus(); }, 0);
    return panel;
  }

  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(view === "settings" && contactOpenId){ contactOpenId = null; render(); return; }
    if(view === "tasks" && openId){ openId = null; openType = null; render(); }
  });

  render();
})();
</script>
</body>
</html>
