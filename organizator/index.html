<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizator</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#fafaf8; color:#181816;
    font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;
    padding:24px 20px 80px;
  }
  .wrap{max-width:600px; margin:0 auto;}

  .line{
    display:flex; align-items:baseline; gap:10px;
    font-size:21px; line-height:1.35; padding:15px 2px;
    border-bottom:2px solid #c9c6bd;
    cursor:pointer; white-space:pre-wrap; word-break:break-word;
    touch-action:none; user-select:none;
  }
  .line.blocked{ border-bottom:2px solid #b3423a; }
  .line-text{ flex:1; min-width:0; }
  .line-assignee{ flex:none; font-size:14px; color:#2f5d50; }
  .line-date{ flex:none; font-size:14px; color:#83807a; }
  .line-date.retard{ color:#b3423a; font-weight:700; }

  .panel{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:10px 2px 14px; border-bottom:1px solid #e2e0da; font-size:14px; color:#83807a;
  }
  .panel input[type=text]{
    font:inherit; font-size:15px; border:none; border-bottom:1px solid #c9c6bd;
    background:transparent; color:#181816; outline:none; min-width:140px;
  }
  .panel input[type=date]{
    font:inherit; font-size:14px; border:none; border-bottom:1px solid #c9c6bd;
    background:transparent; color:#181816; outline:none;
  }
  .panel .toggle{ cursor:pointer; user-select:none; }
  .panel .toggle.on{ color:#b3423a; font-weight:700; text-decoration:underline; }

  .add{
    text-align:center; padding:22px 0; font-size:22px; color:#c9c6bd;
    cursor:pointer; user-select:none;
  }
  .add:hover{color:#83807a;}
</style>
</head>
<body>
<div class="wrap">
  <div id="list"></div>
  <div class="add" id="btn-add">+</div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "organizator:v4";
  var tasks = load();
  var openId = null;   // id of task with an open panel
  var openType = null; // "menu" (nom/bloqué/deadline) ou "assign" (déléguer)

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
      var old = localStorage.getItem("organizator:v3");
      if(old){
        var parsed = JSON.parse(old);
        return parsed.map(function(t){
          return { id: t.id || uid(), text: t.text || "", blocked: !!t.blocked, deadline: t.deadline || "", assignee: "" };
        });
      }
    }catch(e){}
    return [];
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(tasks)); }catch(e){} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function daysBetween(dateStr){
    var today = new Date(todayStr() + "T00:00:00");
    var d = new Date(dateStr + "T00:00:00");
    return Math.round((d - today) / 86400000);
  }
  function fmtDate(dateStr){
    var p = dateStr.split("-");
    return p[2] + "/" + p[1];
  }

  function render(){
    var el = document.getElementById("list");
    el.innerHTML = "";
    tasks.forEach(function(t){
      el.appendChild(renderLine(t));
      if(openId === t.id && openType === "menu") el.appendChild(renderMenu(t));
      if(openId === t.id && openType === "assign") el.appendChild(renderAssign(t));
    });
  }

  function renderLine(t){
    var row = document.createElement("div");
    row.className = "line" + (t.blocked ? " blocked" : "");
    row.dataset.id = t.id;

    var text = document.createElement("span");
    text.className = "line-text";
    text.textContent = t.text;
    row.appendChild(text);

    if(t.assignee){
      var a = document.createElement("span");
      a.className = "line-assignee";
      a.textContent = "→ " + t.assignee;
      row.appendChild(a);
    }

    if(t.deadline){
      var d = document.createElement("span");
      d.className = "line-date" + (daysBetween(t.deadline) < 0 ? " retard" : "");
      d.textContent = fmtDate(t.deadline);
      row.appendChild(d);
    }

    attachGestures(row, t);
    return row;
  }

  function renderMenu(t){
    var panel = document.createElement("div");
    panel.className = "panel";

    var nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = t.text;
    function commitName(){
      var v = nameInput.value.trim();
      if(v === t.text) return; // rien n'a changé : pas de re-rendu, ça casserait un clic en cours sur un autre contrôle du panneau
      if(!v){ tasks = tasks.filter(function(x){ return x.id !== t.id; }); openId = null; }
      else { t.text = v; }
      save(); render();
    }
    nameInput.addEventListener("keydown", function(e){
      if(e.key === "Enter") commitName();
      if(e.key === "Escape"){ openId = null; render(); }
    });
    nameInput.addEventListener("blur", commitName);
    panel.appendChild(nameInput);

    var toggle = document.createElement("span");
    toggle.className = "toggle" + (t.blocked ? " on" : "");
    toggle.textContent = "bloqué";
    toggle.addEventListener("click", function(){ t.blocked = !t.blocked; save(); render(); });
    panel.appendChild(toggle);

    var dateInput = document.createElement("input");
    dateInput.type = "date";
    dateInput.value = t.deadline || "";
    dateInput.addEventListener("change", function(e){ t.deadline = e.target.value; save(); render(); });
    panel.appendChild(dateInput);

    return panel;
  }

  function renderAssign(t){
    var panel = document.createElement("div");
    panel.className = "panel";

    var input = document.createElement("input");
    input.type = "text";
    input.placeholder = "assigné à…";
    input.value = t.assignee || "";
    function commit(){
      t.assignee = input.value.trim();
      openId = null;
      save(); render();
    }
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter") commit();
      if(e.key === "Escape"){ openId = null; render(); }
    });
    input.addEventListener("blur", commit);
    panel.appendChild(input);

    setTimeout(function(){ input.focus(); }, 0);
    return panel;
  }

  function attachGestures(el, t){
    var startX = 0, startY = 0, dx = 0, dy = 0, dragging = false, moved = false, dir = null;
    var H_THRESHOLD = 70, LOCK = 8;

    el.addEventListener("pointerdown", function(e){
      startX = e.clientX; startY = e.clientY; dx = 0; dy = 0;
      dragging = true; moved = false; dir = null;
      el.setPointerCapture(e.pointerId);
      el.style.transition = "none";
    });
    el.addEventListener("pointermove", function(e){
      if(!dragging) return;
      dx = e.clientX - startX; dy = e.clientY - startY;
      if(!dir && (Math.abs(dx) > LOCK || Math.abs(dy) > LOCK)){
        dir = Math.abs(dy) > Math.abs(dx) ? "v" : "h";
        moved = true;
        if(dir === "v"){ el.style.zIndex = "5"; el.style.boxShadow = "0 4px 10px rgba(0,0,0,.15)"; el.style.background = "#fafaf8"; }
      }
      if(dir === "h") el.style.transform = "translateX(" + dx + "px)";
      else if(dir === "v") el.style.transform = "translateY(" + dy + "px)";
    });
    function end(e){
      if(!dragging) return;
      dragging = false;
      el.style.transition = "transform .15s ease";
      el.style.transform = "";
      el.style.zIndex = ""; el.style.boxShadow = ""; el.style.background = "";

      if(!moved){
        openId = t.id; openType = "menu";
        render();
        return;
      }
      if(dir === "h" && Math.abs(dx) >= H_THRESHOLD){
        openId = t.id; openType = "assign";
        render();
      } else if(dir === "v"){
        reorder(t, e.clientY);
      }
    }
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  }

  function reorder(t, clientY){
    var rows = Array.prototype.slice.call(document.querySelectorAll(".line"));
    var newIndex = 0;
    rows.forEach(function(r){
      if(r.dataset.id === t.id) return;
      var rect = r.getBoundingClientRect();
      var mid = rect.top + rect.height / 2;
      if(clientY > mid) newIndex++;
    });
    var fromIndex = tasks.findIndex(function(x){ return x.id === t.id; });
    if(fromIndex === -1) return;
    tasks.splice(fromIndex, 1);
    tasks.splice(newIndex, 0, t);
    save();
    render();
  }

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && openId){ openId = null; openType = null; render(); }
  });

  document.getElementById("btn-add").addEventListener("click", function(){
    var t = { id: uid(), text: "", blocked:false, deadline:"", assignee:"" };
    tasks.push(t);
    openId = t.id; openType = "menu";
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
