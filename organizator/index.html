<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizator</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#fafaf8; color:#181816;
    font-family:"IBM Plex Mono","SF Mono",Menlo,monospace;
    padding:24px 20px 80px;
  }
  .wrap{max-width:600px; margin:0 auto;}

  .line{
    font-size:21px; line-height:1.35; padding:15px 2px;
    border-bottom:1px solid #e2e0da;
    cursor:text; white-space:pre-wrap; word-break:break-word;
  }
  input.line-input{
    width:100%; font:inherit; font-size:21px; line-height:1.35; padding:15px 2px;
    border:none; border-bottom:1px solid #181816; background:transparent; color:#181816;
    outline:none;
  }

  .add{
    text-align:center; padding:22px 0; font-size:22px; color:#c9c6bd;
    cursor:pointer; user-select:none;
  }
  .add:hover{color:#83807a;}
</style>
</head>
<body>
<div class="wrap">
  <div id="list"></div>
  <div class="add" id="btn-add">+</div>
</div>

<script>
(function(){
  "use strict";
  var KEY = "organizator:v3";
  var tasks = load();
  var editingId = null;

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
      var old = localStorage.getItem("organizator:v2");
      if(old){
        var parsed = JSON.parse(old);
        return parsed.map(function(p){ return { id: uid(), text: p.name || "" }; });
      }
    }catch(e){}
    return [];
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(tasks)); }catch(e){} }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function render(){
    var el = document.getElementById("list");
    el.innerHTML = "";
    tasks.forEach(function(t){
      if(t.id === editingId){
        el.appendChild(renderInput(t));
      } else {
        el.appendChild(renderLine(t));
      }
    });
  }

  function renderLine(t){
    var div = document.createElement("div");
    div.className = "line";
    div.textContent = t.text;
    div.addEventListener("click", function(){
      editingId = t.id;
      render();
    });
    return div;
  }

  function renderInput(t){
    var input = document.createElement("input");
    input.type = "text";
    input.className = "line-input";
    input.value = t.text;
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ commit(t, input.value); }
      if(e.key === "Escape"){ editingId = null; render(); }
    });
    input.addEventListener("blur", function(){ commit(t, input.value); });
    setTimeout(function(){ input.focus(); input.setSelectionRange(input.value.length, input.value.length); }, 0);
    return input;
  }

  function commit(t, value){
    var v = value.trim();
    editingId = null;
    if(!v){
      tasks = tasks.filter(function(x){ return x.id !== t.id; });
    } else {
      t.text = v;
    }
    save();
    render();
  }

  document.getElementById("btn-add").addEventListener("click", function(){
    var t = { id: uid(), text: "" };
    tasks.push(t);
    editingId = t.id;
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
